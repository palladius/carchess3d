# QA Scoreboard for CarChess3D models and images
# Generated and audited by VLM Critic (Gemini Flash + Geometry QA)
# Tiers:
#   🟢 [8.0 - 10.0] : TOP_QUALITY (Game ready)
#   🟡 [6.0 - 7.9]  : ACCEPTABLE (Needs polish or refinement)
#   💩 [< 6.0]      : FA_CAGARE (Severe drift, deformed anatomy, or hallucination)

models:
  - piece: "bishop"
    character: "ale"
    model_name: "bishop-ale-2.glb"
    concept_file: "assets/characters/bishop-ale-2.jpg"
    model_file: "assets/models/bishop-ale-2.glb"
    evaluated_at: "2026-10-10"
    scores:
      face_likeness: 4.0
      companion_fidelity: 4.0
      back_view: 3.0
      overall: 3.7
    tier: "FA_CAGARE 💩"
    passed: false
    summary: "Il draghetto non c'azzecca (grumo fuso) e la faccia è molto diversa (appiattita, espressione persa)."
    structural_flaws:
      - "Shoulder dragon mesh fused into torso/collar"
      - "Pinched facial mesh and flattened profile projection"
      - "Non-watertight geometry with floating orphan face at pedestal base"
      - "Model not grounded at Y=0 (sinks halfway below chessboard)"
    aesthetic_flaws:
      - "Severe underexposure and muddied textures on robes"
      - "Loss of anime/chibi charm on the face"

  - piece: "bishop"
    character: "ale"
    model_name: "bishop-ale-rigged.glb"
    concept_file: "assets/characters/bishop-ale-1.jpg"
    model_file: "assets/models/bishop-ale-rigged.glb"
    evaluated_at: "2026-10-10"
    scores:
      face_likeness: 6.8
      companion_fidelity: 6.2
      back_view: 6.7
      overall: 6.6
    tier: "ACCEPTABLE 🟡"
    passed: false  # strict threshold is 7.0 for game ready
    summary: "Salto di qualità enorme con l'approccio modulare: viso riconoscibile e proporzioni buone, ma serve rifinire la saturazione del drago e il clipping con il mantello."
    structural_flaws:
      - "Minor geometry clipping between dragon belly and shoulder cloak"
      - "Model origin needs grounding translation to Y=0"
    aesthetic_flaws:
