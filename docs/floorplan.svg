<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <radialGradient id="swampGrad" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#134e3a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0b3829" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#061d17" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#1b2448"/>
      <stop offset="100%" stop-color="#11332b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#e6b84a"/>
      <stop offset="100%" stop-color="#9c6f19"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b4e"/>
      <stop offset="50%" stop-color="#1a2f5a"/>
      <stop offset="100%" stop-color="#3b1d38"/>
    </linearGradient>
    <pattern id="chessGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#e8dfc8"/>
      <rect x="20" width="20" height="20" fill="#2c3242"/>
      <rect y="20" width="20" height="20" fill="#2c3242"/>
      <rect x="20" y="20" width="20" height="20" fill="#e8dfc8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1400" height="920" fill="#0d1118"/>

  <!-- Header Banner -->
  <rect x="20" y="16" width="1360" height="58" rx="10" fill="#161c28" stroke="#e6b84a" stroke-width="1.5"/>
  <text x="40" y="42" fill="#ffe082" font-size="19" font-weight="700">🏰🚽 CarChess3D ("Carlesso al Cesso") — 2D Spatial Blueprint &amp; Canonical Metric Coordinates (1 unit = 1.0m)</text>
  <text x="40" y="62" fill="#9aa3b5" font-size="13">Altar Board: 8.0m × 8.0m at y = 0.0m (border 0.8m → 9.6m × 9.6m) · Braziers: (±5.2m, y = 1.2m, ±5.2m) · 16:9 Cinema Mirror: 8.0m × 4.5m at (0, y = 4.5m, z = -10.0m) · Zurich Skyline &amp; Alps: z = -16m..-25m</text>

  <!-- ======================================================================= -->
  <!-- PANEL 1: TOP-DOWN PLAN VIEW (X-Z PLANE, 1m = 12px, origin at 360, 490) -->
  <!-- ======================================================================= -->
  <g id="top-down-panel">
    <rect x="20" y="88" width="680" height="812" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/>
    <text x="40" y="118" fill="#e6b84a" font-size="16" font-weight="700">1. TOP-DOWN PLAN VIEW (X–Z Plane · Scale: 1.0m = 16px)</text>
    <text x="40" y="138" fill="#9aa3b5" font-size="12">Origin (0, 0, 0) = Board Center at y = 0.0m · North (-Z) = Background Cinema &amp; Zurich Skyline · South (+Z) = White Home Rank</text>

    <!-- Coordinate Origin at (360, 520) -->
    <!-- Swamp Moat Outer Ring r = 18m (288px) -->
    <circle cx="360" cy="520" r="288" fill="url(#swampGrad)" stroke="#26a678" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="360" y="824" fill="#4cd9a2" font-size="11" text-anchor="middle">Enchanted Swamp Emerald Moat Outer Radius r = 18.0m (y = -0.45m)</text>

    <!-- Swamp Moat Inner Island r = 6.5m (104px) -->
    <circle cx="360" cy="520" r="104" fill="#1e2631" stroke="#4cd9a2" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="360" y="640" fill="#8be8c2" font-size="10" text-anchor="middle">Stone Sanctuary Island r = 6.5m</text>

    <!-- Lily Pads & Swamp Roots in Moat (r = 6m..18m) -->
    <g fill="#258f5a" stroke="#5ce69b" stroke-width="1">
      <circle cx="210" cy="430" r="14"/>
      <circle cx="235" cy="455" r="10"/>
      <circle cx="510" cy="445" r="15"/>
      <circle cx="485" cy="610" r="13"/>
      <circle cx="220" cy="605" r="12"/>
      <circle cx="300" cy="690" r="16"/>
      <circle cx="430" cy="680" r="11"/>
      <circle cx="155" cy="525" r="14"/>
      <circle cx="555" cy="535" r="15"/>
    </g>

    <!-- Distant Alps Backdrop at z = -25.0m (y_svg = 520 - 25*14 = 170) -->
    <path d="M 70 190 L 130 155 L 185 182 L 250 148 L 315 180 L 370 145 L 435 178 L 505 150 L 575 182 L 645 158 L 650 195 L 70 195 Z" fill="#2c3e5e" stroke="#9ec5ff" stroke-width="1.5"/>
    <text x="360" y="165" fill="#d6e6ff" font-size="11" font-weight="600" text-anchor="middle">🏔️ Snow-Capped Swiss Alps Backdrop (z = -25.0m, Width = 60m, Height = 18m)</text>

    <!-- Limmat River & Bridges (z = -14m..-18m) -->
    <path d="M 65 268 Q 220 255, 360 268 T 655 265" fill="none" stroke="#1b7a9c" stroke-width="16" stroke-opacity="0.7"/>
    <text x="580" y="262" fill="#7bdff2" font-size="10" text-anchor="middle">Limmat River (z = -16m)</text>

    <!-- St. Peter Clock Spire (-11.5m, z = -16.0m) & Fraumünster (+11.5m, z = -16.0m) -->
    <rect x="160" y="252" width="32" height="32" rx="4" fill="#3a4559" stroke="#e6b84a" stroke-width="1.5"/>
    <circle cx="176" cy="268" r="9" fill="#111" stroke="#ffd54f" stroke-width="1.5"/>
    <text x="176" y="300" fill="#ffd54f" font-size="10" text-anchor="middle">St. Peter Spire</text>
    <text x="176" y="312" fill="#9aa3b5" font-size="9" text-anchor="middle">(-11.5m, z=-16m, h=13m)</text>

    <rect x="528" y="252" width="32" height="32" rx="4" fill="#2b5870" stroke="#7bdff2" stroke-width="1.5"/>
    <circle cx="544" cy="268" r="7" fill="#7bdff2"/>
    <text x="544" y="300" fill="#7bdff2" font-size="10" text-anchor="middle">Fraumünster Spire</text>
    <text x="544" y="312" fill="#9aa3b5" font-size="9" text-anchor="middle">(+11.5m, z=-16m, h=12.5m)</text>

    <!-- Grossmünster Twin Towers (±5.8m, z = -10.5m) & 16:9 Magic Cinema Mirror (8.0m x 4.5m at z = -10.0m, y = 4.5m) -->
    <!-- At 1m = 16px: z = -10.0m -> y_svg = 520 - 160 = 360. Width 8.0m = 128px (x = 296..424) -->
    <rect x="252" y="336" width="36" height="36" rx="5" fill="#463c33" stroke="#e6b84a" stroke-width="2"/>
    <circle cx="270" cy="354" r="10" fill="#9c3d2b" stroke="#ffd54f" stroke-width="1.2"/>
    <text x="242" y="328" fill="#ffd54f" font-size="10" text-anchor="middle">Grossmünster W (-5.8m, z=-10.5m)</text>

    <rect x="432" y="336" width="36" height="36" rx="5" fill="#463c33" stroke="#e6b84a" stroke-width="2"/>
    <circle cx="450" cy="354" r="10" fill="#9c3d2b" stroke="#ffd54f" stroke-width="1.2"/>
    <text x="478" y="328" fill="#ffd54f" font-size="10" text-anchor="middle">Grossmünster E (+5.8m, z=-10.5m)</text>

    <!-- 16:9 Cinema Screen at z = -10.0m (x = -4.0m..+4.0m -> 296..424) -->
    <rect x="296" y="350" width="128" height="12" rx="3" fill="url(#goldGrad)" stroke="#fff3c4" stroke-width="1.5"/>
    <text x="360" y="344" fill="#ffe082" font-size="11" font-weight="700" text-anchor="middle">🎬 16:9 Veo Cinema Mirror (8.0m × 4.5m at z = -10.0m, y = 4.5m)</text>

    <!-- Carved Stone Rune Altar Outer Border: 9.6m x 9.6m (8.0m + 2*0.8m) -> 153.6px -->
    <rect x="283.2" y="443.2" width="153.6" height="153.6" rx="6" fill="#2a241e" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- 8x8 Chessboard: 8.0m x 8.0m (128px x 128px, 16px per 1.0m square) -->
    <!-- Squares from x = 296 to 424, y = 456 to 584 -->
    <g transform="translate(296, 456)">
      <rect width="128" height="128" fill="url(#chessGrid)" stroke="#e6b84a" stroke-width="1.5"/>
      <!-- Rank 8 & 7 (Black Pieces) -->
      <g fill="#1c202b" stroke="#c0c8d8" stroke-width="1.2">
        <circle cx="8" cy="8" r="6"/><circle cx="24" cy="8" r="6"/><circle cx="40" cy="8" r="6"/><circle cx="56" cy="8" r="6"/>
        <circle cx="72" cy="8" r="6"/><circle cx="88" cy="8" r="6"/><circle cx="104" cy="8" r="6"/><circle cx="120" cy="8" r="6"/>
        <circle cx="8" cy="24" r="5.5"/><circle cx="24" cy="24" r="5.5"/><circle cx="40" cy="24" r="5.5"/><circle cx="56" cy="24" r="5.5"/>
        <circle cx="72" cy="24" r="5.5"/><circle cx="88" cy="24" r="5.5"/><circle cx="104" cy="24" r="5.5"/><circle cx="120" cy="24" r="5.5"/>
      </g>
      <!-- Rank 2 & 1 (White Pieces) -->
      <g fill="#fcf6e8" stroke="#e6b84a" stroke-width="1.2">
        <circle cx="8" cy="104" r="5.5"/><circle cx="24" cy="104" r="5.5"/><circle cx="40" cy="104" r="5.5"/><circle cx="56" cy="104" r="5.5"/>
        <circle cx="72" cy="104" r="5.5"/><circle cx="88" cy="104" r="5.5"/><circle cx="104" cy="104" r="5.5"/><circle cx="120" cy="104" r="5.5"/>
        <circle cx="8" cy="120" r="6"/><circle cx="24" cy="120" r="6"/><circle cx="40" cy="120" r="6"/><circle cx="56" cy="120" r="6"/>
        <circle cx="72" cy="120" r="6"/><circle cx="88" cy="120" r="6"/><circle cx="104" cy="120" r="6"/><circle cx="120" cy="120" r="6"/>
      </g>
    </g>

    <!-- 4 Corner Wizard Chess Flaming Braziers at (±5.2m, y = 1.2m, ±5.2m) -> ±83.2px from (360, 520) -->
    <g stroke="#ffd54f" stroke-width="2" fill="#ff6d00">
      <circle cx="276.8" cy="436.8" r="9"/>
      <circle cx="443.2" cy="436.8" r="9"/>
      <circle cx="276.8" cy="603.2" r="9"/>
      <circle cx="443.2" cy="603.2" r="9"/>
    </g>
    <text x="195" y="432" fill="#ffb74d" font-size="10">🔥 Brazier NW (-5.2m, -5.2m)</text>
    <text x="458" y="432" fill="#ffb74d" font-size="10">🔥 Brazier NE (+5.2m, -5.2m)</text>
    <text x="195" y="616" fill="#ffb74d" font-size="10">🔥 Brazier SW (-5.2m, +5.2m)</text>
    <text x="458" y="616" fill="#ffb74d" font-size="10">🔥 Brazier SE (+5.2m, +5.2m)</text>

    <!-- Default Player Camera Position (0, y = 7.2m, z = +9.8m) -->
    <polygon points="360,665 348,688 372,688" fill="#64b5f6" stroke="#e3f2fd" stroke-width="1.5"/>
    <line x1="360" y1="665" x2="360" y2="520" stroke="#64b5f6" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="360" y="704" fill="#90caf9" font-size="11" font-weight="600" text-anchor="middle">📷 Default Orbit Camera (0.0m, y = 7.2m, z = +9.8m, FOV = 42°)</text>

    <!-- Dimension Annotations -->
    <line x1="296" y1="600" x2="424" y2="600" stroke="#ffe082" stroke-width="1.5"/>
    <text x="360" y="613" fill="#ffe082" font-size="11" font-weight="700" text-anchor="middle">8.0m Board (8 × 1.0m squares) + 0.8m Rune Border</text>
  </g>

  <!-- ======================================================================= -->
  <!-- PANEL 2: SIDE ELEVATION & PIECE HEIGHT HIERARCHY (Right Column)         -->
  <!-- ======================================================================= -->
  <g id="side-elevation-panel">
    <rect x="720" y="88" width="660" height="430" rx="12" fill="url(#skyGrad)" stroke="#2a3346" stroke-width="1.5"/>
    <text x="740" y="118" fill="#e6b84a" font-size="16" font-weight="700">2. SIDE ELEVATION PROFILE (Y–Z Plane · Ground Plane y = 0.0m)</text>
    <text x="740" y="138" fill="#9aa3b5" font-size="12">Strict Grounding Law: Every piece mesh, pedestal, and prop sits cleanly at bbox.min.y === 0.0m</text>

    <!-- Ground Line y = 0.0m at y_svg = 430 -->
    <line x1="740" y1="430" x2="1360" y2="430" stroke="#4cd9a2" stroke-width="2"/>
    <text x="745" y="423" fill="#4cd9a2" font-size="11" font-weight="700">y = 0.0m (Board Surface Plane)</text>

    <!-- Swamp Water Level y = -0.45m (y_svg = 442) -->
    <rect x="740" y="442" width="620" height="45" rx="4" fill="#0d4232" opacity="0.85"/>
    <line x1="740" y1="442" x2="1360" y2="442" stroke="#26a678" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="745" y="462" fill="#8be8c2" font-size="11">Swamp Emerald Water Plane: y = -0.45m · Altar Stone Foundation: y = -0.60m .. 0.0m</text>

    <!-- Alps at z = -25.0m (h = 16m) -->
    <polygon points="755,430 795,210 845,270 895,195 955,430" fill="#2c3e5e" opacity="0.7" stroke="#9ec5ff" stroke-width="1.5"/>
    <text x="845" y="185" fill="#d6e6ff" font-size="10" text-anchor="middle">Alps (z = -25.0m, h = 16m)</text>

    <!-- Grossmünster Twin Towers (z = -10.5m, h = 11.0m) & Suspended 16:9 Cinema Mirror (z = -10.0m, center y = 4.5m, h = 4.5m -> y = 2.25m..6.75m) -->
    <!-- Using vertical scale 1m = 18px from y_svg = 430 -->
    <rect x="945" y="232" width="42" height="198" fill="#463c33" stroke="#e6b84a" stroke-width="2"/>
    <polygon points="945,232 966,196 987,232" fill="#9c3d2b" stroke="#ffd54f" stroke-width="1.5"/>
    <text x="966" y="186" fill="#ffd54f" font-size="10" text-anchor="middle">Grossmünster (h = 11.0m)</text>

    <!-- 16:9 Cinema Screen: y = 2.25m to 6.75m (center y = 4.5m, height = 4.5m -> 81px) -->
    <rect x="995" y="308" width="90" height="81" rx="4" fill="url(#screenGrad)" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <text x="1040" y="345" fill="#ffe082" font-size="10" font-weight="700" text-anchor="middle">16:9 VEO CINEMA</text>
    <text x="1040" y="360" fill="#ffffff" font-size="9" text-anchor="middle">8.0m × 4.5m</text>
    <text x="1040" y="374" fill="#9ec5ff" font-size="9" text-anchor="middle">Center y = 4.5m</text>
    <text x="1040" y="385" fill="#9ec5ff" font-size="8" text-anchor="middle">z = -10.0m</text>

    <!-- Altar Stone Base (z = -4.8m .. +4.8m -> x_svg = 1105 .. 1255, y = -0.6m .. 0.0m) -->
    <rect x="1105" y="430" width="150" height="16" fill="#3a3228" stroke="#e6b84a" stroke-width="2"/>
    <text x="1180" y="442" fill="#ffe082" font-size="9" text-anchor="middle">8×8 Stone Altar (9.6m w, y=0.0m top)</text>

    <!-- Corner Brazier Pillar at z = ±5.2m, flame bowl at y = 1.2m -->
    <rect x="1088" y="408" width="10" height="22" fill="#594a3a" stroke="#e6b84a" stroke-width="1"/>
    <circle cx="1093" cy="403" r="6" fill="#ff6d00" stroke="#ffd54f" stroke-width="1.5"/>
    <text x="1093" y="392" fill="#ffb74d" font-size="9" text-anchor="middle">Brazier (y=1.2m)</text>

    <!-- Pieces on Board (y = 0.0m -> y_svg = 430) -->
    <rect x="1125" y="405" width="12" height="25" rx="2" fill="#1c202b" stroke="#c0c8d8" stroke-width="1.2"/>
    <rect x="1145" y="413" width="10" height="17" rx="2" fill="#1c202b" stroke="#c0c8d8" stroke-width="1.2"/>
    <rect x="1205" y="413" width="10" height="17" rx="2" fill="#fcf6e8" stroke="#e6b84a" stroke-width="1.2"/>
    <rect x="1225" y="396" width="12" height="34" rx="2" fill="#fcf6e8" stroke="#e6b84a" stroke-width="1.2"/>

    <!-- Parabolic Jump Arc Preview -->
    <path d="M 1210 413 Q 1180 355, 1150 413" fill="none" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="1180" y="372" fill="#ffeb3b" font-size="9" text-anchor="middle">Parabolic Jump Arc (h_peak = 1.4m)</text>

    <!-- Player Camera Sightline -->
    <circle cx="1335" cy="300" r="7" fill="#64b5f6" stroke="#fff" stroke-width="1.5"/>
    <line x1="1335" y1="300" x2="1180" y2="425" stroke="#64b5f6" stroke-width="1.2" stroke-dasharray="5,3"/>
    <line x1="1335" y1="300" x2="1040" y2="348" stroke="#ce93d8" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="1310" y="286" fill="#90caf9" font-size="10" text-anchor="middle">Camera (y=7.2m, z=+9.8m)</text>
  </g>

  <!-- ======================================================================= -->
  <!-- PANEL 3: CANONICAL PIECE HEIGHT & PEDESTAL HIERARCHY (Bottom Right)     -->
  <!-- ======================================================================= -->
  <g id="piece-hierarchy-panel">
    <rect x="720" y="534" width="660" height="366" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/>
    <text x="740" y="564" fill="#e6b84a" font-size="16" font-weight="700">3. CANONICAL PIECE HEIGHT HIERARCHY &amp; PEDESTAL SPEC (y = 0.0m Grounded)</text>
    <text x="740" y="584" fill="#9aa3b5" font-size="12">Square = 1.0m × 1.0m · Pedestal Diameter = 0.75m (r = 0.375m) · Pedestal Height = 0.22m · GLB/Medallion Normalized to Rank Height</text>

    <!-- Ground Line y = 0.0m at y_svg = 835 (Scale: 1.0m = 110px) -->
    <line x1="750" y1="835" x2="1350" y2="835" stroke="#4cd9a2" stroke-width="2.5"/>
    <text x="750" y="855" fill="#4cd9a2" font-size="11" font-weight="700">y = 0.00m (bbox.min.y === 0.00m)</text>

    <!-- 1. Pawn Puffin (0.80m -> 88.0px, Dimezzato) -->
    <g transform="translate(800, 835)">
      <rect x="-24" y="-24" width="48" height="24" rx="4" fill="#fcf6e8" stroke="#e6b84a" stroke-width="2"/>
      <rect x="-18" y="-88" width="36" height="64" rx="8" fill="#3a6ea5" stroke="#ffe082" stroke-width="2"/>
      <text x="0" y="-96" fill="#ffe082" font-size="12" font-weight="700" text-anchor="middle">♙ 0.80m</text>
      <text x="0" y="38" fill="#e8eaf0" font-size="11" font-weight="600" text-anchor="middle">Pawn (Dimezzato)</text>
      <text x="0" y="52" fill="#9aa3b5" font-size="10" text-anchor="middle">Base compatta · GLB</text>
    </g>

    <!-- 2. Bishop Ale (1.55m -> 170.5px) -->
    <g transform="translate(895, 835)">
      <rect x="-30" y="-24" width="60" height="24" rx="4" fill="#fcf6e8" stroke="#e6b84a" stroke-width="2"/>
      <rect x="-24" y="-170.5" width="48" height="146.5" rx="12" fill="#2d4a8a" stroke="#ffe082" stroke-width="2"/>
      <text x="0" y="-180" fill="#ffe082" font-size="12" font-weight="700" text-anchor="middle">♗ 1.55m</text>
      <text x="0" y="38" fill="#e8eaf0" font-size="11" font-weight="600" text-anchor="middle">Bishop (Ale 🐉)</text>
      <text x="0" y="52" fill="#9aa3b5" font-size="10" text-anchor="middle">Ø 0.75m · Rigged GLB</text>
    </g>

    <!-- 3. Queen Kate (1.68m -> 184.8px) -->
    <g transform="translate(990, 835)">
      <rect x="-31" y="-24" width="62" height="24" rx="4" fill="#fcf6e8" stroke="#e6b84a" stroke-width="2"/>
      <rect x="-24" y="-184.8" width="48" height="160.8" rx="14" fill="#8e3b82" stroke="#ffe082" stroke-width="2"/>
      <text x="0" y="-194" fill="#ffe082" font-size="12" font-weight="700" text-anchor="middle">♕ 1.68m</text>
      <text x="0" y="38" fill="#e8eaf0" font-size="11" font-weight="600" text-anchor="middle">Queen (Kate)</text>
      <text x="0" y="52" fill="#9aa3b5" font-size="10" text-anchor="middle">Ø 0.76m · Hybrid</text>
    </g>

    <!-- 4. King Riccardo (1.86m -> 204.6px) -->
    <g transform="translate(1085, 835)">
      <rect x="-32" y="-24" width="64" height="24" rx="4" fill="#fcf6e8" stroke="#e6b84a" stroke-width="2"/>
      <rect x="-26" y="-204.6" width="52" height="180.6" rx="14" fill="#b8860b" stroke="#ffe082" stroke-width="2.5"/>
      <text x="0" y="-214" fill="#ffe082" font-size="12" font-weight="700" text-anchor="middle">♔ 1.86m</text>
      <text x="0" y="38" fill="#e8eaf0" font-size="11" font-weight="600" text-anchor="middle">King (Riccardo)</text>
      <text x="0" y="52" fill="#9aa3b5" font-size="10" text-anchor="middle">Ø 0.78m · Hybrid</text>
    </g>

    <!-- 5. Knight Seby (1.92m -> 211.2px) -->
    <g transform="translate(1180, 835)">
      <rect x="-35" y="-24" width="70" height="24" rx="6" fill="#fcf6e8" stroke="#e6b84a" stroke-width="2"/>
      <rect x="-25" y="-211.2" width="50" height="187.2" rx="12" fill="#d96b27" stroke="#ffe082" stroke-width="2"/>
      <text x="0" y="-220" fill="#ffe082" font-size="12" font-weight="700" text-anchor="middle">♘ 1.92m</text>
      <text x="0" y="38" fill="#e8eaf0" font-size="11" font-weight="600" text-anchor="middle">Knight (Seby 🐴)</text>
      <text x="0" y="52" fill="#9aa3b5" font-size="10" text-anchor="middle">Plinto ovale allungato</text>
    </g>

    <!-- 6. Rook Pupurabbu (2.50m -> 275.0px) -->
    <g transform="translate(1280, 835)">
