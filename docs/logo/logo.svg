<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#ffd54f" stroke-width="3" stroke-opacity="0.8"/>

  <g opacity="0.25">
    <polygon points="14,104 64,120 114,104 64,90" fill="#ffffff"/>
    <polygon points="39,97 64,105 89,97 64,90" fill="#000000"/>
  </g>

  <path d="M42,96 L86,96 L82,60 L78,56 L50,56 L46,60 Z" fill="#f8fafc" stroke="#ffe082" stroke-width="2.5"/>
  <rect x="40" y="94" width="48" height="8" rx="3" fill="url(#goldGrad)"/>

  <path d="M44,56 L40,36 L52,44 L64,30 L76,44 L88,36 L84,56 Z" fill="url(#goldGrad)" stroke="#ffb300" stroke-width="2"/>
  
  <path d="M64,20 L64,30 M59,24 L69,24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="32" cy="40" r="3" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <circle cx="96" cy="42" r="2.5" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <circle cx="28" cy="74" r="2" fill="#ffd54f" filter="url(#glow)"/>
  <circle cx="100" cy="72" r="3" fill="#ffe082" filter="url(#glow)"/>
</svg>
