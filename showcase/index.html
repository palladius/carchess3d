<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarChess3D · Character showcase (throwaway)</title>
  <!--
    🧪 THROWAWAY SHOWCASE — not the game.
    One card per default character: 2D art (front / back) + auto-rotating 3D GLB when one exists.
    Serve the repo root (`just serve`) and open http://localhost:8000/showcase/
    To change a default, edit the CHARACTERS table below (data-driven, no if/else per character).
  -->
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js" } }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11141b; --card: #1a1f2b; --line: #2a3142; --text: #e8eaf0; --muted: #9aa3b5;
      --gold: #e6b84a; --blue: #2d4a8a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 24px 28px 8px; }
    header h1 { margin: 0 0 4px; font-size: 1.6rem; }
    header p { margin: 0; color: var(--muted); }
    .warn { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
            background: #3a2a10; color: var(--gold); font-size: .85rem; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr));
           gap: 20px; padding: 20px 28px 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
            display: flex; flex-direction: column; }
    .card.winner { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 30px #e6b84a22; }
    .card h2 { margin: 0; padding: 14px 16px 4px; font-size: 1.15rem; }
    .card .sub { padding: 0 16px 10px; color: var(--muted); font-size: .9rem; }
    .badge { font-size: .72rem; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
             background: var(--blue); }
    .badge.gold { background: var(--gold); color: #1a1300; }
    .badge.guess { background: #444b5c; }
    .media { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
    .pane { background: #0d1016; position: relative; aspect-ratio: 1; }
    .pane img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pane canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    .pane .label { position: absolute; top: 8px; left: 8px; font-size: .75rem; padding: 2px 8px;
                   border-radius: 6px; background: #000a; }
    .pane .placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
                         color: var(--muted); padding: 20px; }
    .tabs { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; }
    .tabs button { font: inherit; font-size: .75rem; padding: 3px 10px; border-radius: 6px; cursor: pointer;
                   border: 1px solid var(--line); background: #000b; color: var(--text); }
    .tabs button[aria-pressed="true"] { background: var(--gold); color: #1a1300; border-color: var(--gold); }
    /* Every card has the same layout; several 3D versions = tabs inside the 3D pane (same size as the others) */
    .fs { position: absolute; top: 6px; right: 6px; z-index: 2; font-size: 1.1rem; line-height: 1; padding: 4px 8px;
          border-radius: 6px; border: 1px solid var(--line); background: #000b; color: var(--text); cursor: pointer; }
    .pane[data-3d]:fullscreen { aspect-ratio: auto; width: 100vw; height: 100vh; background: #0d1016; }
    .pane[data-3d]:fullscreen .tabs { bottom: 24px; left: 24px; }
    dl { margin: 0; padding: 12px 16px 16px; display: grid; grid-template-columns: max-content 1fr;
         gap: 4px 12px; font-size: .85rem; }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-word; }
    dd a { color: #9cc3ff; }
    code { font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>🏰🚽 CarChess3D — Character showcase</h1>
    <p>Personaggi di default: una card per pezzo, 2D (fronte / retro) + 3D in autorotazione (trascina per girarlo, <b>doppio click o ⛶ = schermo intero</b>, Esc per uscire).</p>
    <span class="warn">🧪 Throwaway showcase, NON il gioco vero e proprio</span>
  </header>
  <main id="cards"></main>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '../vendor/three/addons/loaders/GLTFLoader.js';

    // ── Data: one row per piece. `defaultConfirmed: false` = my guess, Riccardo hasn't picked yet. ──
    const CHARACTERS = [
      {
        glyph: '♗', piece: 'Bishop', name: 'Ale 1 — CON CAPPELLO', winner: true, defaultConfirmed: true,
        tagline: 'Il Vincitore Designato per la scacchiera',
        front: '../assets/characters/bishop-ale-1.jpg',
        back: '../tools/model-pipeline/ale/experiments_back/back_nb_2.1.png',
        backGrid: '../tools/model-pipeline/ale/experiments_back/ale_hat_back_comparison_grid.jpg',
        models: [
          { label: 'v1 · 1 vista', url: '../assets/models/bishop-ale-1.glb',
            note: 'v1 (canonico attuale): TRELLIS da sola vista frontale, retro inventato.' },
          { label: 'v2 · 3 viste ❌', url: '../tools/model-pipeline/ale/out/ale1_hat_f_tq_back.glb',
            note: 'v2 (scartata da Riccardo: 2 mezzi draghi): TRELLIS multi-image fronte + 3/4 + retro NB 2.1, seed 42.' },
        ],
        details: 'Mitria vescovile blu e oro, occhioni verdi sorridenti, bastoncino pastorale in legno, basamento marmo + legno.',
      },
      {
        glyph: '♔', piece: 'King', name: 'Riccardo', defaultConfirmed: false,
        front: '../assets/characters/king-riccardo-1.jpg',
        back: '../tools/model-pipeline/king/back.png',
        model: null, details: 'Re della famiglia.',
      },
      {
        glyph: '♕', piece: 'Queen', name: 'Kate', defaultConfirmed: false,
        front: '../assets/characters/queen-kate-4.jpg',
        back: null, model: null, details: 'Base usata dalle edit NB in tools/model-pipeline/kate/.',
      },
      {
        glyph: '♘', piece: 'Knight', name: 'Seby', defaultConfirmed: false,
        front: '../assets/characters/knight-seby-4.jpg',
        back: '../tools/model-pipeline/seby/back_nb_2.1.png',
        model: null, details: 'Cavaliere (concept #4, usato nella pipeline multi-view).',
      },
      {
        glyph: '♖', piece: 'Rook', name: 'Pupurabbu', defaultConfirmed: false,
        front: '../assets/characters/rook-pupurabbu.jpg',
        back: '../tools/model-pipeline/rook/back.png',
        model: null, details: 'Torre.',
      },
      {
        glyph: '♙', piece: 'Pawn', name: 'Puffin Swiss Guard', defaultConfirmed: true,
        front: '../assets/characters/pawn-puffin.jpg',
        back: '../tools/model-pipeline/nbviews/gemini-nano-banana-2.1/back.png',
        model: '../assets/models/pawn-puffin.glb',
        details: 'Pulcinella di mare in uniforme da Guardia Svizzera, alabarda.',
        modelNote: 'TRELLIS single-view: retro inventato (bianco).',
      },
    ];

    const link = (p) => p ? `<a href="${p}" target="_blank"><code>${p.replace('../', '')}</code></a>` : '—';
    const modelsOf = (c) => c.models ?? (c.model ? [{ label: 'v1', url: c.model, note: c.modelNote }] : []);

    function cardHTML(c, i) {
      const models = modelsOf(c);
      const badge = c.winner ? '<span class="badge gold">🏆 vincitore</span>'
        : c.defaultConfirmed ? '<span class="badge">default</span>'
        : '<span class="badge guess">default da confermare</span>';
      return `
        <article class="card ${c.winner ? 'winner' : ''}">
          <h2>${c.glyph} ${c.name} ${badge}</h2>
          <div class="sub">${c.piece}${c.tagline ? ' · ' + c.tagline : ''}</div>
          <div class="media">
            <div class="pane">
              <span class="label">2D</span>
              <img src="${c.front}" alt="${c.name} — 2D fronte" loading="lazy" data-img="${i}">
              <div class="tabs">
                <button aria-pressed="true" data-side="front" data-card="${i}">Fronte</button>
                ${c.back ? `<button aria-pressed="false" data-side="back" data-card="${i}">Retro</button>` : ''}
              </div>
            </div>
            <div class="pane" data-3d="${i}">
              <span class="label">3D</span>
              ${models.length ? `<button class="fs" data-fs="${i}" title="Schermo intero (o doppio click)">⛶</button>` : ''}
              ${models.length ? '<div class="placeholder">⏳ carico il GLB…</div>'
                              : '<div class="placeholder">3D non ancora generato ⏳</div>'}
              ${models.length > 1 ? `<div class="tabs">${models.map((m, k) =>
                `<button aria-pressed="${k === 0}" data-ver="${k}" data-card="${i}">${m.label}</button>`).join('')}</div>` : ''}
            </div>
          </div>
          <dl>
            <dt>Source</dt><dd>${link(c.front)}</dd>
            <dt>Dettagli</dt><dd>${c.details}</dd>
            ${c.backGrid ? `<dt>Retro GenAI</dt><dd>${link(c.backGrid)}</dd>` : ''}
            <dt>Vista posteriore</dt><dd>${link(c.back)}</dd>
            <dt>Modello 3D</dt><dd>${models.length ? models.map((m) =>
              `${link(m.url)}${m.note ? `<br><small>${m.note}</small>` : ''}`).join('<br>') : '—'}</dd>
          </dl>
        </article>`;
    }

    const root = document.getElementById('cards');
    root.innerHTML = CHARACTERS.map(cardHTML).join('');
    const views = {}; // card index -> 3D view

    // 2D front/back toggle, 3D version toggle, 3D fullscreen button
    root.addEventListener('click', (e) => {
      const fsBtn = e.target.closest('button[data-fs]');
      if (fsBtn) return toggleFullscreen(fsBtn.closest('.pane'));
      const btn = e.target.closest('button[data-side], button[data-ver]');
      if (!btn) return;
      const i = btn.dataset.card;
      if (btn.dataset.ver !== undefined) views[i]?.show(Number(btn.dataset.ver));
      else {
        const c = CHARACTERS[i];
        root.querySelector(`img[data-img="${i}"]`).src = btn.dataset.side === 'back' ? c.back : c.front;
      }
      btn.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === btn));
    });
    root.addEventListener('dblclick', (e) => {
      const pane = e.target.closest('.pane[data-3d]');
      if (pane && pane.querySelector('canvas') && !e.target.closest('button')) toggleFullscreen(pane);
    });
    function toggleFullscreen(pane) {
      if (document.fullscreenElement) document.exitFullscreen();
      else pane.requestFullscreen();
    }

    // ── 3D view adapter: one renderer per card, one model visible at a time ──
    // Every model is normalised to the SAME height (MODEL_H), with its spin radius capped so wide
    // pieces (halberd, staff, wings) still fit: all characters look the same size across cards.
    const loader = new GLTFLoader();
    const FOV = 30;
    const MODEL_H = 2;        // world units, every piece
    const MAX_RADIUS = 1.1;   // max horizontal half-extent while spinning
    const MARGIN = 1.15;

    function makeView(pane, models) {
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 3.2));
      const key = new THREE.DirectionalLight(0xffffff, 2.5);
      key.position.set(2, 3, 4);
      scene.add(key);
      const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100);

      const slots = models.map((_, k) => {
        const g = new THREE.Group();
        g.visible = k === 0;
        scene.add(g);
        return g;
      });
      const view = { pane, renderer, scene, camera, slots, angle: 0,
                     visible: false, dragging: false, lastX: 0, idleAt: 0,
                     show: (k) => slots.forEach((g, j) => { g.visible = j === k; }) };

      models.forEach((m, k) => loader.load(m.url, (gltf) => {
        const obj = gltf.scene;
        const box = new THREE.Box3().setFromObject(obj);
        const size = box.getSize(new THREE.Vector3());
        obj.position.sub(box.getCenter(new THREE.Vector3()));
        const radius = Math.hypot(size.x, size.z) / 2;
        const holder = new THREE.Group();
        holder.scale.setScalar(Math.min(MODEL_H / size.y, MAX_RADIUS / radius));
        holder.add(obj);
        slots[k].add(holder);
        if (!renderer.domElement.isConnected) {
          pane.querySelector('.placeholder')?.remove();
          pane.prepend(renderer.domElement);
          resize(view);
        }
      }, undefined, (err) => {
        const ph = pane.querySelector('.placeholder');
        if (ph) ph.textContent = `❌ ${m.label}: ${err.message}`;
      }));

      const el = renderer.domElement;
      el.addEventListener('pointerdown', (e) => { view.dragging = true; view.lastX = e.clientX; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', (e) => {
        if (!view.dragging) return;
        view.angle += (e.clientX - view.lastX) * 0.01;
        view.lastX = e.clientX;
      });
      el.addEventListener('pointerup', () => { view.dragging = false; view.idleAt = performance.now(); });
      return view;
    }

    // Same framing for every card: fit MODEL_H (height) and the spin diameter (width).
    function resize(v) {
      const w = v.pane.clientWidth, h = v.pane.clientHeight;
      if (!w || !h) return;
      v.renderer.setSize(w, h, false);
      v.camera.aspect = w / h;
      const t = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
      const needH = MODEL_H * MARGIN, needW = 2 * MAX_RADIUS * MARGIN;
      const dist = Math.max(needH / 2 / t, needW / 2 / (t * v.camera.aspect)) + MAX_RADIUS;
      v.camera.position.set(0, 0.25, dist);
      v.camera.lookAt(0, 0, 0);
      v.camera.updateProjectionMatrix();
    }

    CHARACTERS.forEach((c, i) => {
      const models = modelsOf(c);
      if (models.length) views[i] = makeView(root.querySelector(`[data-3d="${i}"]`), models);
    });
    const viewList = Object.values(views);

    // Pause offscreen canvases (a fullscreen pane always counts as visible)
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      const v = viewList.find((x) => x.pane === en.target);
      if (v) v.visible = en.isIntersecting;
    }));
    const ro = new ResizeObserver((entries) => entries.forEach((en) => {
      const v = viewList.find((x) => x.pane === en.target);
      if (v) resize(v);
    }));
    viewList.forEach((v) => { io.observe(v.pane); ro.observe(v.pane); });

    const clock = new THREE.Clock();
    function tick() {
      const dt = clock.getDelta();
      const now = performance.now();
      for (const v of viewList) {
        if (!v.visible && document.fullscreenElement !== v.pane) continue;
        if (!v.dragging && now - v.idleAt > 1500) v.angle += dt * 0.6; // auto-rotate
        v.slots.forEach((g) => { g.rotation.y = v.angle; });
        v.renderer.render(v.scene, v.camera);
      }
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
