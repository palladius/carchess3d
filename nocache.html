<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0d1118">
  <meta name="description" content="CarChess3D No-Cache Direct Permalink (Bypasses & Purges PWA Service Worker and HTTP Disk Cache).">
  <title>CarChess3D · ⚡ No-Cache Live Mode (v0.3.64) 🏰🚽</title>
  <link rel="icon" href="./docs/logo/logo.svg" type="image/svg+xml">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #162238 0%, #090d14 75%, #05070b 100%);
      color: #f4f6fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #app-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    canvas#game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
      background-color: #0b1528;
    }
    #nocache-banner {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(16, 185, 129, 0.96);
      color: #04130d;
      font-weight: 800;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.6s ease;
      white-space: nowrap;
      max-width: 96vw;
      overflow-x: auto;
    }
    #nocache-banner a,
    #nocache-banner button {
      background: #04130d;
      color: #ffe082;
      border: 1px solid #ffe082;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">CarChess3D — No-Cache Live Permalink</h1>
  <div id="nocache-banner">
    <span id="nocache-status">🧹 Purging PWA Service Worker &amp; HTTP Disk Cache…</span>
    <a href="./showcase/?view=pov" title="Open Heroes POV Cinema (Seby, Ale, Riccardo, Kate... 6 Attack + 6 Defense Movies)">🎬 Cinema Eroi POV</a>
    <a href="./?nocache=1" title="Open main URL with fresh cache">🏰 /carchess3d/</a>
    <button type="button" id="nocache-dismiss" title="Hide banner">✕</button>
  </div>
  <main id="app-viewport" aria-label="Scacchiera 3D nella Palude Incantata di Zurigo">
    <canvas id="game-canvas"></canvas>
  </main>

  <script type="module">
    const banner = document.getElementById('nocache-banner');
    const statusEl = document.getElementById('nocache-status');
    document.getElementById('nocache-dismiss')?.addEventListener('click', () => {
      if (banner) banner.style.display = 'none';
    });

    const LIVE_MODULES = [
      './',
      './VERSION',
      './index.html',
      './sw.js',
      './manifest.webmanifest',
      './vendor/chess.js',
      './vendor/three/three.module.js',
      './src/main.js',
      './src/utils/glbGrounding.js',
      './src/core/EventBus.js',
      './src/core/GameLoop.js',
      './src/core/Registry.js',
      './src/core/BattleMatrix36.js',
      './src/core/CharacterPovData.js',
      './src/core/Rng.js',
      './src/ai/worker.js',
      './src/managers/GameFlowManager.js',
      './src/managers/BoardMapManager.js',
      './src/managers/PieceManager.js',
      './src/managers/CombatAnimationManager.js',
      './src/managers/DropManager.js',
      './src/managers/AIWorkerManager.js',
      './src/views/ZurichSwampView.js',
      './src/views/SkeletonRigHelper.js',
      './src/views/PieceView.js',
      './src/views/BoardInteractionView.js',
      './src/views/VFXPoolView.js',
      './src/views/VeoCinemaView.js',
      './src/views/WowModeView.js',
      './src/views/DebugPanelView.js',
      './src/listeners/HudListener.js',
      './src/listeners/AudioListener.js',
      './src/listeners/ProfileStorageListener.js',
    ];

    try {
      let swCount = 0;
      let cacheCount = 0;
      const hadController = Boolean(navigator.serviceWorker?.controller);
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        swCount = regs.length;
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        cacheCount = keys.length;
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
      // If an old Service Worker was still controlling this page when it opened, reload once
      // so the Service Worker controller is completely detached BEFORE refreshing HTTP disk cache!
      if (hadController && sessionStorage.getItem('carchess_nocache_detached') !== '1') {
        sessionStorage.setItem('carchess_nocache_detached', '1');
        location.reload();
      } else {
        sessionStorage.removeItem('carchess_nocache_detached');
      }

      // Force Chrome's HTTP disk cache (GitHub Pages max-age=600) to reload './', './index.html' and every JS module fresh from network
      await Promise.allSettled(
        LIVE_MODULES.map((u) => fetch(u, { cache: 'reload' })),
      );
      if ('caches' in window) {
        const leftoverKeys = await caches.keys();
        await Promise.all(leftoverKeys.map((k) => caches.delete(k)));
      }
      const { APP_VERSION } = await import(`./src/core/Registry.js?t=${Date.now()}`);
      try {
        localStorage.setItem('carchess3d_boot_ver', APP_VERSION);
      } catch {}
      if (statusEl) {
        statusEl.textContent = `⚡ NO-CACHE LIVE v${APP_VERSION} · Purged ${swCount} SW + ${cacheCount} Caches`;
      }
    } catch (err) {
      console.warn('[CarChess3D nocache] Cache purge warning:', err);
    }
    await import(`./src/main.js?nocache=1&t=${Date.now()}`);
  </script>
</body>
</html>
