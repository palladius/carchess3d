<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d1118">
  <meta name="description" content="CarChess3D (Carlesso al Cesso / Scacchi di Famiglia) — Scacchi 3D Magici nella Palude Incantata di Zurigo con Cinema Veo 16:9 e WOW Mode.">
  <title>CarChess3D · Carlesso al Cesso 🏰🚽</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./docs/logo/logo.svg" type="image/svg+xml">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f18;
      color: #f5efe0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #app-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    canvas#game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* Visually hidden SEO/a11y heading */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">CarChess3D — Carlesso al Cesso (Scacchi di Famiglia 3D)</h1>
  <main id="app-viewport" aria-label="Scacchiera 3D nella Palude Incantata di Zurigo">
    <canvas id="game-canvas"></canvas>
  </main>

  <script type="module" src="./src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
