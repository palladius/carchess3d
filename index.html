<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0d1118">
  <meta name="description" content="CarChess3D (Family Wizard Chess / Carlesso al Cesso) — Magical 3D Chess in the Enchanted Swamp of Zurich with 16:9 Veo Cinema and WOW Mode.">
  <title>CarChess3D · Family Wizard Chess 🏰🚽</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./docs/logo/logo.svg" type="image/svg+xml">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f18;
      color: #f5efe0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #app-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    canvas#game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
      background-color: #0b1528;
    }
    /* Visually hidden SEO/a11y heading */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">CarChess3D — Carlesso al Cesso (Scacchi di Famiglia 3D)</h1>
  <main id="app-viewport" aria-label="Scacchiera 3D nella Palude Incantata di Zurigo">
    <canvas id="game-canvas"></canvas>
  </main>

  <script type="module">
    const CORE_MODULES = [
      './',
      './index.html',
      './src/main.js',
      './src/utils/glbGrounding.js',
      './src/core/EventBus.js',
      './src/core/GameLoop.js',
      './src/core/Registry.js',
      './src/core/BattleMatrix36.js',
      './src/core/Rng.js',
      './src/ai/worker.js',
      './src/managers/GameFlowManager.js',
      './src/managers/BoardMapManager.js',
      './src/managers/PieceManager.js',
      './src/managers/CombatAnimationManager.js',
      './src/managers/DropManager.js',
      './src/managers/AIWorkerManager.js',
      './src/views/ZurichSwampView.js',
      './src/views/SkeletonRigHelper.js',
      './src/views/PieceView.js',
      './src/views/BoardInteractionView.js',
      './src/views/VFXPoolView.js',
      './src/views/VeoCinemaView.js',
      './src/views/WowModeView.js',
      './src/views/DebugPanelView.js',
      './src/listeners/HudListener.js',
      './src/listeners/AudioListener.js',
      './src/listeners/ProfileStorageListener.js',
    ];

    async function purgeSwAndCaches() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        await Promise.allSettled(CORE_MODULES.map((u) => fetch(u, { cache: 'reload' })));
      } catch {
        // Ignore storage/network restrictions
      }
    }

    const sp = new URLSearchParams(location.search);
    const nocache = sp.get('nocache') === '1' || sp.get('fresh') === '1';
    let bootQuery = '';

    if (nocache) {
      await purgeSwAndCaches();
      bootQuery = `?nocache=1&t=${Date.now()}`;
    } else {
      try {
        const res = await fetch('./VERSION', { cache: 'no-store' });
        if (res.ok) {
          const liveVer = (await res.text()).trim();
          const lastVer = localStorage.getItem('carchess3d_boot_ver');
          if (liveVer && lastVer && lastVer !== liveVer) {
            await purgeSwAndCaches();
            bootQuery = `?v=${encodeURIComponent(liveVer)}&t=${Date.now()}`;
          }
          if (liveVer) {
            localStorage.setItem('carchess3d_boot_ver', liveVer);
          }
        }
      } catch {
        // Offline or localStorage restricted — proceed with normal module import
      }
    }

    await import(`./src/main.js${bootQuery}`);

    if (
      !nocache &&
      'serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')
    ) {
      navigator.serviceWorker
        .register('./sw.js', { updateViaCache: 'none' })
        .then((reg) => reg.update().catch(() => {}))
        .catch(() => {});
    }
  </script>
</body>
</html>
